# Carbon Black: Batcomputer
# Quiet central surfaces with compact, directional telemetry at their edges.

[bar]
background = "#000000"
background-alpha = 0.94
text = "#D5D5D0"
active = "#61D6FF"
scale-with-font = false
size-horizontal = 24
size-vertical = 26

[hyprland]
active-border = "rgba(61d6ffff) rgba(212223cc) rgba(060708ee) rgba(61d6ffff) 135deg"
active-border-foreground = "rgba(61d6ffff) rgba(d5d5d0cc) rgba(61d6ffff) 135deg"

[controls]
normal-color = "#606468"
normal-fill-alpha = 0.025
normal-border = "#606468"
normal-border-width = 1
normal-border-alpha = 0.32

hover-cursor-color = "#D5D5D0"
hover-cursor-fill-alpha = 0.07
hover-cursor-border = "#74A8C7"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.68

focus-color = "#61D6FF"
focus-fill-alpha = 0.09
focus-border = "#61D6FF"
focus-border-width = 1
focus-border-alpha = 0.9

selected-color = "#61D6FF"
selected-fill-alpha = 0.14
selected-border = "rgba(61d6ffff) rgba(212223bb) rgba(61d6ffff) 135deg"
selected-border-width = 1
selected-border-alpha = 1.0

pressed-fill-alpha = 0.2
selection-fill-alpha = 0.28

[spacing]
scale = 0.9
scale-with-font = false
control-gap = 7
control-padding-x = 9
control-padding-y = 5
control-height = 26
popup-row-height = 27
row-gap = 6
row-padding-x = 11
panel-gap = 12
panel-padding = 15
popup-padding = 12

[font]
base-size = 11
caption = 9
body-small = 10
body = 11
subtitle = 12
title = 13
heading = 15
display = 22
display-large = 26

[popups]
background = "#000000"
background-alpha = 0.96
text = "#D5D5D0"
border = "hyprland.active-border"
border-alpha = 0.9
border-width = "1 2 1 1"

[tooltip]
background = "#060708"
background-alpha = 0.98
text = "#D5D5D0"
border = "#606468"
border-alpha = 0.65
border-width = "0 1 1 0"

[notifications]
background = "#000000"
background-alpha = 0.96
text = "#D5D5D0"
border = "hyprland.active-border"
border-alpha = 0.9
border-width = "1 2 1 1"
countdown = "#61D6FF"

[launcher]
background = "#000000"
background-alpha = 0.96
text = "#D5D5D0"
border = "hyprland.active-border-foreground"
border-alpha = 0.95
border-width = "1 2 1 2"
scrim = "#000000"
scrim-alpha = 0.62
selected-background = "#61D6FF"
selected-background-alpha = 0.1
selected-text = "#8DE4FF"
selected-border = "rgba(61d6ffff) rgba(212223cc) rgba(61d6ffff) 135deg"
selected-border-alpha = 1.0
selected-border-width = "1 3 1 1"

[menu]
background = "#000000"
background-alpha = 0.97
text = "#D5D5D0"
border = "hyprland.active-border-foreground"
border-alpha = 0.9
border-width = "1 2 1 1"
scrim = "#000000"
scrim-alpha = 0.58
selected-background = "#61D6FF"
selected-background-alpha = 0.09
selected-text = "#8DE4FF"
selected-border = "rgba(61d6ffff) rgba(212223cc) rgba(61d6ffff) 135deg"
selected-border-alpha = 1.0
selected-border-width = "0 2 1 0"

[polkit]
background = "#000000"
background-alpha = 0.98
text = "#D5D5D0"
text-error = "#E46E6E"
border = "hyprland.active-border"
border-error = "#E46E6E"
border-alpha = 1.0
border-width = "1 2 1 2"
scrim = "#000000"
scrim-alpha = 0.7
accent = "#61D6FF"

[lock]
background = "#000000"
background-alpha = 0.88
text = "#D5D5D0"
placeholder = "#606468"
text-error = "#E46E6E"
border = "#606468"
border-active = "hyprland.active-border"
border-error = "#E46E6E"
border-alpha = 1.0
border-width = "1 2 1 2"
selection = "#61D6FF"
selection-alpha = 0.4

[image-picker]
scrim = "#000000"
scrim-alpha = 0.66
text = "#D5D5D0"
selected-border = "hyprland.active-border"
selected-border-alpha = 1.0
unselected-border = "#606468"
unselected-border-alpha = 0.38
